server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Hashed asset filenames change on every build, so they can be cached hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html must never be cached: it is what points at the hashed assets, and
  # a stale copy sends the browser after files that no longer exist.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Single page app: unknown paths are the app's to resolve, not 404s.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
